<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Examiner - Login</title>

    <!-- Favicon References -->
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    
    <!-- Font Awesome (CDN is reliable) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* DIRECT STYLES - No CSS variables that might fail */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #10a37f 0%, #4fd1c5 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 15px;
        }

        .login-wrapper {
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
        }

        .login-card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            padding: 30px 25px;
            width: 100%;
        }

        /* Dark mode support - simple */
        @media (prefers-color-scheme: dark) {
            .login-card {
                background: #1e293b;
            }
            .login-header p, .tab, .form-group label {
                color: #cbd5e1;
            }
            .input-wrapper input {
                background: #334155;
                border-color: #475569;
                color: #f1f5f9;
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .login-header i {
            font-size: 55px;
            color: #10a37f;
            margin-bottom: 10px;
        }

        .login-header h1 {
            font-size: 28px;
            font-weight: 700;
            color: #10a37f;
            margin-bottom: 5px;
        }

        .login-header p {
            color: #64748b;
            font-size: 14px;
        }

        .tab-container {
            display: flex;
            margin-bottom: 25px;
            border-bottom: 2px solid #e2e8f0;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 12px;
            cursor: pointer;
            font-weight: 600;
            color: #64748b;
            font-size: 16px;
        }

        .tab.active {
            color: #10a37f;
            border-bottom: 2px solid #10a37f;
            margin-bottom: -2px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #475569;
            font-weight: 500;
            font-size: 14px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 16px;
        }

        .input-wrapper input {
            width: 100%;
            padding: 14px 14px 14px 45px;
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            color: #1e293b;
            font-size: 15px;
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: #10a37f;
        }

        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #94a3b8;
            padding: 5px;
        }

        .btn-login {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #10a37f 0%, #4fd1c5 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-login:active {
            transform: scale(0.98);
        }

        .error-message {
            background: #fee2e2;
            color: #dc2626;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            background: #dcfce7;
            color: #16a34a;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        /* Mobile responsive */
        @media (max-width: 480px) {
            .login-card {
                padding: 20px;
            }
            .login-header i {
                font-size: 45px;
            }
            .login-header h1 {
                font-size: 24px;
            }
            .tab {
                padding: 10px;
                font-size: 15px;
            }
            .input-wrapper input {
                padding: 12px 12px 12px 40px;
            }
            .btn-login {
                padding: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card" id="loginCard">
            <div class="login-header">
                <i class="fas fa-chart-line"></i>
                <h1>Data Examiner</h1>
                <p>AI-Powered Data Analysis</p>
            </div>

            <div class="tab-container">
                <div class="tab active" id="loginTab">Login</div>
                <div class="tab" id="signupTab">Sign Up</div>
            </div>

            <div id="errorMessage" class="error-message"></div>
            <div id="successMessage" class="success-message"></div>

            <!-- Login Form -->
            <div id="loginForm">
                <div class="form-group">
                    <label>Email</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="loginEmail" placeholder="Enter your email">
                    </div>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="loginPassword" placeholder="Enter your password">
                        <span class="password-toggle" id="toggleLoginPassword">
                            <i class="fas fa-eye"></i>
                        </span>
                    </div>
                </div>

                <button class="btn-login" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
            </div>

            <!-- Signup Form -->
            <div id="signupForm" style="display: none;">
                <div class="form-group">
                    <label>Full Name</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user"></i>
                        <input type="text" id="signupName" placeholder="Enter your full name">
                    </div>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="signupEmail" placeholder="Enter your email">
                    </div>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="signupPassword" placeholder="Create a password">
                        <span class="password-toggle" id="toggleSignupPassword">
                            <i class="fas fa-eye"></i>
                        </span>
                    </div>
                </div>

                <div class="form-group">
                    <label>Confirm Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="signupConfirmPassword" placeholder="Confirm your password">
                        <span class="password-toggle" id="toggleConfirmPassword">
                            <i class="fas fa-eye"></i>
                        </span>
                    </div>
                </div>

                <button class="btn-login" id="signupBtn">
                    <i class="fas fa-user-plus"></i> Sign Up
                </button>
            </div>
        </div>
    </div>

    <script>
        // ULTRA SIMPLE SCRIPT - Guaranteed to work
        (function() {
            console.log('Login script starting...');
            
            // Show that the page loaded
            document.body.style.border = '2px solid green';
            
            // Get elements
            const loginTab = document.getElementById('loginTab');
            const signupTab = document.getElementById('signupTab');
            const loginForm = document.getElementById('loginForm');
            const signupForm = document.getElementById('signupForm');
            const errorDiv = document.getElementById('errorMessage');
            const successDiv = document.getElementById('successMessage');
            
            // Check if elements exist
            console.log('loginTab:', !!loginTab);
            console.log('signupTab:', !!signupTab);
            console.log('loginForm:', !!loginForm);
            console.log('signupForm:', !!signupForm);
            
            if (!loginTab || !signupTab || !loginForm || !signupForm) {
                console.error('Missing elements!');
                document.body.innerHTML += '<div style="color:red;position:fixed;top:0;left:0;">Error loading page</div>';
                return;
            }
            
            // Tab switching
            loginTab.addEventListener('click', function() {
                console.log('Login tab clicked');
                loginTab.classList.add('active');
                signupTab.classList.remove('active');
                loginForm.style.display = 'block';
                signupForm.style.display = 'none';
            });
            
            signupTab.addEventListener('click', function() {
                console.log('Signup tab clicked');
                signupTab.classList.add('active');
                loginTab.classList.remove('active');
                signupForm.style.display = 'block';
                loginForm.style.display = 'none';
            });
            
            // Password toggle
            function togglePassword(btnId, inputId) {
                const btn = document.getElementById(btnId);
                const input = document.getElementById(inputId);
                if (btn && input) {
                    btn.addEventListener('click', function(e) {
                        e.preventDefault();
                        const icon = this.querySelector('i');
                        if (input.type === 'password') {
                            input.type = 'text';
                            icon.classList.remove('fa-eye');
                            icon.classList.add('fa-eye-slash');
                        } else {
                            input.type = 'password';
                            icon.classList.remove('fa-eye-slash');
                            icon.classList.add('fa-eye');
                        }
                    });
                }
            }
            
            togglePassword('toggleLoginPassword', 'loginPassword');
            togglePassword('toggleSignupPassword', 'signupPassword');
            togglePassword('toggleConfirmPassword', 'signupConfirmPassword');
            
            // Show message functions
            function showError(msg) {
                console.log('Error:', msg);
                if (errorDiv) {
                    errorDiv.textContent = msg;
                    errorDiv.classList.add('show');
                    setTimeout(() => errorDiv.classList.remove('show'), 3000);
                } else {
                    alert(msg);
                }
            }
            
            function showSuccess(msg) {
                console.log('Success:', msg);
                if (successDiv) {
                    successDiv.textContent = msg;
                    successDiv.classList.add('show');
                    setTimeout(() => successDiv.classList.remove('show'), 3000);
                } else {
                    alert(msg);
                }
            }
            
            // Login handler
            document.getElementById('loginBtn').addEventListener('click', function() {
                console.log('Login clicked');
                const email = document.getElementById('loginEmail').value;
                const password = document.getElementById('loginPassword').value;
                
                if (!email || !password) {
                    showError('Please fill all fields');
                    return;
                }
                
                // Get users
                let users = [];
                try {
                    users = JSON.parse(localStorage.getItem('users') || '[]');
                } catch(e) {
                    console.error('Error parsing users:', e);
                }
                
                const user = users.find(u => u.email === email && u.password === password);
                
                if (user) {
                    localStorage.setItem('currentUser', JSON.stringify({
                        email: user.email,
                        name: user.name || email.split('@')[0]
                    }));
                    showSuccess('Login successful!');
                    setTimeout(() => window.location.href = '/', 1000);
                } else {
                    showError('Invalid email or password');
                }
            });
            
            // Signup handler
            document.getElementById('signupBtn').addEventListener('click', function() {
                console.log('Signup clicked');
                const name = document.getElementById('signupName').value;
                const email = document.getElementById('signupEmail').value;
                const password = document.getElementById('signupPassword').value;
                const confirm = document.getElementById('signupConfirmPassword').value;
                
                if (!name || !email || !password || !confirm) {
                    showError('Please fill all fields');
                    return;
                }
                
                if (password.length < 6) {
                    showError('Password must be at least 6 characters');
                    return;
                }
                
                if (password !== confirm) {
                    showError('Passwords do not match');
                    return;
                }
                
                // Get users
                let users = [];
                try {
                    users = JSON.parse(localStorage.getItem('users') || '[]');
                } catch(e) {
                    console.error('Error parsing users:', e);
                }
                
                if (users.some(u => u.email === email)) {
                    showError('Email already exists');
                    return;
                }
                
                users.push({
                    name: name,
                    email: email,
                    password: password,
                    createdAt: new Date().toISOString()
                });
                
                localStorage.setItem('users', JSON.stringify(users));
                localStorage.setItem('currentUser', JSON.stringify({ email: email, name: name }));
                
                showSuccess('Account created!');
                setTimeout(() => window.location.href = '/', 1000);
            });
            
            // Check if already logged in
            if (localStorage.getItem('currentUser') && window.location.pathname !== '/') {
                window.location.href = '/';
            }
            
            console.log('Login script completed successfully');
        })();
    </script>
</body>
</html>
