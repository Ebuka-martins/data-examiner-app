<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Examiner - Login</title>

        <!-- Favicon References -->
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
    <link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png">

        <!-- PWA Manifest (optional but fine) -->
    <link rel="manifest" href="/manifest.json">
    
    <!-- Link to your existing styles.css -->
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

        <!-- Basic Meta Tags -->
    <meta name="theme-color" content="#10a37f">
    <meta name="description" content="Login to Data Examiner - AI-powered data analysis tool">
    <meta name="format-detection" content="telephone=no">
        
    <style>
        /* Override body styles for login page */
        body {
            background: var(--primary-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: auto;
        }

        /* IMPROVED LOGIN WRAPPER - Perfect fit for all devices */
        .login-wrapper {
            width: 100%;
            max-width: 450px;
            padding: 15px;
            margin: auto;
            animation: fadeInUp 0.6s ease;
        }

        /* Adjust card padding for better proportions */
        .login-card {
            background: var(--bg-card);
            border-radius: var(--radius-2xl);
            box-shadow: var(--shadow-xl);
            padding: 30px;
            border: 1px solid var(--border-color);
            max-height: 90vh;
            overflow-y: auto;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header i {
            font-size: 60px;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
        }

        .login-header h1 {
            font-size: var(--font-size-3xl);
            font-weight: 700;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        .login-header p {
            color: var(--text-muted);
            font-size: var(--font-size-sm);
        }

        .tab-container {
            display: flex;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--border-color);
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 15px;
            cursor: pointer;
            font-weight: 600;
            color: var(--text-muted);
            transition: all var(--transition-base);
            position: relative;
        }

        .tab.active {
            color: var(--primary-color);
        }

        .tab.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--primary-gradient);
            animation: slideIn 0.3s ease;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-weight: 500;
            font-size: var(--font-size-sm);
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: var(--font-size-base);
        }

        .input-wrapper input {
            width: 100%;
            padding: 15px 15px 15px 45px;
            background: var(--bg-input);
            border: 2px solid var(--border-color);
            border-radius: var(--radius-lg);
            color: var(--text-primary);
            font-size: var(--font-size-base);
            transition: all var(--transition-fast);
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(16, 163, 127, 0.1);
        }

        .input-wrapper input::placeholder {
            color: var(--text-light);
        }

        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--text-muted);
            transition: color var(--transition-fast);
        }

        .password-toggle:hover {
            color: var(--primary-color);
        }

        .btn-login {
            width: 100%;
            padding: 16px;
            background: var(--primary-gradient);
            color: white;
            border: none;
            border-radius: var(--radius-lg);
            font-size: var(--font-size-base);
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-base);
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }

        .btn-login::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn-login:hover::before {
            width: 300px;
            height: 300px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .error-message {
            background: rgba(255, 107, 107, 0.1);
            color: var(--accent-color);
            padding: 12px;
            border-radius: var(--radius-md);
            margin-bottom: 20px;
            font-size: var(--font-size-sm);
            border-left: 4px solid var(--accent-color);
            display: none;
        }

        .error-message.show {
            display: block;
            animation: shake 0.5s ease;
        }

        .success-message {
            background: rgba(16, 163, 127, 0.1);
            color: var(--primary-color);
            padding: 12px;
            border-radius: var(--radius-md);
            margin-bottom: 20px;
            font-size: var(--font-size-sm);
            border-left: 4px solid var(--primary-color);
            display: none;
        }

        .success-message.show {
            display: block;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        /* Dark mode adjustments */
        [data-theme="dark"] .login-card {
            background: var(--bg-secondary);
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .login-wrapper {
                max-width: 400px;
                padding: 10px;
            }
            
            .login-card {
                padding: 25px;
            }
            
            .login-header i {
                font-size: 50px;
            }
            
            .login-header h1 {
                font-size: var(--font-size-2xl);
            }
        }

        @media (max-width: 480px) {
            .login-wrapper {
                max-width: 100%;
                padding: 8px;
            }
            
            .login-card {
                padding: 20px;
                border-radius: var(--radius-xl);
                max-height: 95vh;
            }
            
            .login-header {
                margin-bottom: 20px;
            }
            
            .login-header i {
                font-size: 45px;
                margin-bottom: 10px;
            }
            
            .login-header h1 {
                font-size: var(--font-size-xl);
            }
            
            .login-header p {
                font-size: var(--font-size-xs);
            }
            
            .tab-container {
                margin-bottom: 20px;
            }
            
            .tab {
                padding: 12px;
                font-size: var(--font-size-sm);
            }
            
            .form-group {
                margin-bottom: 15px;
            }
            
            .form-group label {
                font-size: var(--font-size-xs);
                margin-bottom: 5px;
            }
            
            .input-wrapper input {
                padding: 12px 12px 12px 40px;
                font-size: var(--font-size-sm);
            }
            
            .input-wrapper i {
                font-size: var(--font-size-sm);
                left: 12px;
            }
            
            .btn-login {
                padding: 14px;
                font-size: var(--font-size-sm);
                margin-bottom: 15px;
            }
        }

        @media (max-width: 360px) {
            .login-card {
                padding: 15px;
            }
            
            .login-header i {
                font-size: 40px;
            }
            
            .login-header h1 {
                font-size: var(--font-size-lg);
            }
            
            .tab {
                padding: 10px;
                font-size: var(--font-size-xs);
            }
            
            .input-wrapper input {
                padding: 10px 10px 10px 35px;
            }
            
            .btn-login {
                padding: 12px;
            }
        }

        /* For very tall screens, center vertically better */
        @media (min-height: 800px) {
            .login-wrapper {
                display: flex;
                align-items: center;
                min-height: 100vh;
            }
        }

        /* For landscape orientation on mobile */
        @media (max-height: 600px) and (orientation: landscape) {
            body {
                align-items: flex-start;
                padding: 20px 0;
            }
            
            .login-card {
                max-height: none;
                overflow-y: visible;
            }
            
            .login-header {
                margin-bottom: 15px;
            }
            
            .login-header i {
                font-size: 35px;
                margin-bottom: 5px;
            }
            
            .login-header h1 {
                font-size: var(--font-size-lg);
                margin-bottom: 0;
            }
            
            .login-header p {
                display: none;
            }
            
            .tab-container {
                margin-bottom: 15px;
            }
            
            .form-group {
                margin-bottom: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <i class="fas fa-chart-line"></i>
                <h1>Data Examiner</h1>
                <p>AI-Powered Data Analysis</p>
            </div>

            <div class="tab-container">
                <div class="tab active" id="loginTab" onclick="switchTab('login')">Login</div>
                <div class="tab" id="signupTab" onclick="switchTab('signup')">Sign Up</div>
            </div>

            <div id="errorMessage" class="error-message"></div>
            <div id="successMessage" class="success-message"></div>

            <!-- Login Form -->
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Email</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="loginEmail" placeholder="Enter your email" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="loginPassword" placeholder="Enter your password" required>
                        <span class="password-toggle" onclick="togglePassword('loginPassword')">
                            <i class="fas fa-eye"></i>
                        </span>
                    </div>
                </div>

                <button type="submit" class="btn-login">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
            </form>

            <!-- Signup Form -->
            <form id="signupForm" onsubmit="handleSignup(event)" style="display: none;">
                <div class="form-group">
                    <label>Full Name</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user"></i>
                        <input type="text" id="signupName" placeholder="Enter your full name">
                    </div>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="signupEmail" placeholder="Enter your email" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="signupPassword" placeholder="Create a password" required>
                        <span class="password-toggle" onclick="togglePassword('signupPassword')">
                            <i class="fas fa-eye"></i>
                        </span>
                    </div>
                </div>

                <div class="form-group">
                    <label>Confirm Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="signupConfirmPassword" placeholder="Confirm your password" required>
                        <span class="password-toggle" onclick="togglePassword('signupConfirmPassword')">
                            <i class="fas fa-eye"></i>
                        </span>
                    </div>
                </div>

                <button type="submit" class="btn-login">
                    <i class="fas fa-user-plus"></i> Sign Up
                </button>
            </form>

            <!-- Optional: Add a simple separator or leave empty -->
            <div style="margin-top: 20px;"></div>
        </div>
    </div>

    <script>
        // Switch between login and signup tabs
        function switchTab(tab) {
            const loginTab = document.getElementById('loginTab');
            const signupTab = document.getElementById('signupTab');
            const loginForm = document.getElementById('loginForm');
            const signupForm = document.getElementById('signupForm');

            if (tab === 'login') {
                loginTab.classList.add('active');
                signupTab.classList.remove('active');
                loginForm.style.display = 'block';
                signupForm.style.display = 'none';
            } else {
                signupTab.classList.add('active');
                loginTab.classList.remove('active');
                signupForm.style.display = 'block';
                loginForm.style.display = 'none';
            }
        }

        // Toggle password visibility
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const icon = event.currentTarget.querySelector('i');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        // Show error message
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
            setTimeout(() => {
                errorDiv.classList.remove('show');
            }, 3000);
        }

        // Show success message
        function showSuccess(message) {
            const successDiv = document.getElementById('successMessage');
            successDiv.textContent = message;
            successDiv.classList.add('show');
            setTimeout(() => {
                successDiv.classList.remove('show');
            }, 3000);
        }

        // Handle Login
        function handleLogin(event) {
            event.preventDefault();
            
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            if (!email || !password) {
                showError('Please fill in all fields');
                return;
            }

            // Get users from localStorage
            const users = JSON.parse(localStorage.getItem('users') || '[]');
            
            // Check regular users
            const user = users.find(u => u.email === email && u.password === password);
            
            if (user) {
                localStorage.setItem('currentUser', JSON.stringify({
                    email: user.email,
                    name: user.name || user.email.split('@')[0]
                }));
                
                showSuccess('Login successful! Redirecting...');
                setTimeout(() => {
                    window.location.href = '/';
                }, 1000);
            } else {
                showError('Invalid email or password');
            }
        }

        // Handle Signup
        function handleSignup(event) {
            event.preventDefault();
            
            const name = document.getElementById('signupName').value;
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;
            const confirmPassword = document.getElementById('signupConfirmPassword').value;

            if (!name || !email || !password || !confirmPassword) {
                showError('Please fill in all fields');
                return;
            }

            if (password.length < 6) {
                showError('Password must be at least 6 characters');
                return;
            }

            if (password !== confirmPassword) {
                showError('Passwords do not match');
                return;
            }

            const users = JSON.parse(localStorage.getItem('users') || '[]');
            
            if (users.some(u => u.email === email)) {
                showError('User with this email already exists');
                return;
            }

            const newUser = {
                name: name,
                email: email,
                password: password,
                createdAt: new Date().toISOString()
            };

            users.push(newUser);
            localStorage.setItem('users', JSON.stringify(users));

            localStorage.setItem('currentUser', JSON.stringify({
                email: email,
                name: name
            }));

            showSuccess('Account created successfully! Redirecting...');
            
            setTimeout(() => {
                window.location.href = '/';
            }, 1000);
        }

        // Check if already logged in
        const currentUser = localStorage.getItem('currentUser');
        if (currentUser && window.location.pathname !== '/') {
            window.location.href = '/';
        }
    </script>
</body>
</html>
